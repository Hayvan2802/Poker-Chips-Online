name: Publish Poker Chips
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run test:multiplayer
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("releases.json","utf8"))[0]; fs.writeFileSync("release-notes.md",r.title+"\n\n"+r.changes.map(x=>"- "+x).join("\n")+"\n");'
          gh release create "v$version" --target "$GITHUB_SHA" --title "Poker Chips v$version" --notes-file release-notes.md
