name: Publish Poker Chips
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run test:multiplayer
      - run: npm run build:pages
      - name: Publish generated files to gh-pages
        working-directory: dist
        run: |
          git -C .. fetch origin gh-pages:refs/remotes/origin/gh-pages
          git -C .. worktree add --detach ../pages origin/gh-pages
          rsync -a --delete --exclude=.git ./ ../../pages/
          cd ../../pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish $GITHUB_SHA"
          git push origin HEAD:gh-pages
